<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UUID生成器</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:560px;margin:0 auto;padding:32px 20px;flex:1;text-align:center}
h1{font-size:1.5rem;color:#1a1a1a;margin-bottom:20px}
.uuid-box{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px}
.uuid{font-family:"SF Mono",Monaco,Consolas,monospace;font-size:1.1rem;color:#1a73e8;padding:16px;background:#f8f9fa;border-radius:6px;word-break:break-all;margin-bottom:12px}
.history{font-size:.85rem;color:#5f6368;text-align:left;max-height:200px;overflow-y:auto;margin-top:12px}
.history div{padding:6px 0;border-bottom:1px solid #f0f0f0;font-family:"SF Mono",Monaco,Consolas,monospace;font-size:.8rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:10px 24px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-primary{background:#1a73e8;color:#fff}.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}.btn-secondary:hover{background:#f0f0f0}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
</style><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container"><h1>UUID 生成器</h1>
<div class="uuid-box"><div class="uuid" id="uuid"></div>
<div class="actions"><button class="btn btn-primary" onclick="generate()">生成新的</button><button class="btn btn-accent" onclick="copyUUID()">复制</button><button class="btn btn-secondary" onclick="batchGen()">批量生成x10</button></div>
</div>
<div class="history" id="history"><h3 style="margin-bottom:8px">历史记录</h3></div></div>
<footer class="footer"><p>UUID在浏览器本地生成 (crypto.randomUUID)</p></footer>
<script>
var history=[];
function generate(){var u = crypto.randomUUID();document.getElementById("uuid").textContent=u;history.unshift(u);if(history.length>20)history.pop();renderHistory();return u}
function renderHistory(){document.getElementById("history").innerHTML="<h3 style=margin-bottom:8px>历史记录</h3>"+history.map(function(u,i){return"<div>"+(i+1)+". "+u+" <a href=# style=color:#1a73e8;font-size:.8rem onclick=\"setActive('"+u+"')\">使用</a></div>"}).join("")}
function setActive(u){document.getElementById("uuid").textContent=u}
function copyUUID(){var u=document.getElementById("uuid").textContent;navigator.clipboard.writeText(u)}
function batchGen(){for(var i=0;i<10;i++)generate()}
generate();
</script></body></html>
