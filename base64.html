<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="免费在线Base64编解码工具，支持文字和文件转换。浏览器本地处理。">
<title>在线Base64编解码 - 免费文字/文件转Base64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:0 24px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;gap:5px;padding:14px 16px;text-decoration:none;color:#5f6368;font-size:.9rem;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.nav a:hover{color:#1a73e8}
.nav a.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.nav .brand{font-weight:700;font-size:1rem;color:#1a1a1a;margin-right:16px;padding:14px 8px}
.container{max-width:800px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#5f6368;font-size:.9rem;margin-bottom:20px}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #e8eaed}
.tabs button{padding:10px 24px;border:none;background:none;font-size:.95rem;cursor:pointer;color:#5f6368;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;font-family:inherit}
.tabs button.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.io-box{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px}
.io-box label{font-size:.85rem;color:#5f6368;display:block;margin-bottom:6px}
.io-box textarea{width:100%;padding:12px;border:1px solid #dadce0;border-radius:6px;font-family:"SF Mono",Monaco,Consolas,monospace;font-size:.85rem;line-height:1.6;resize:vertical;min-height:120px;outline:none}
.io-box textarea:focus{border-color:#1a73e8}
.actions{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}
.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}
.btn-secondary:hover{background:#f0f0f0}
.file-input{display:none}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
@media(max-width:600px){.container{padding:16px 10px}}
</style>
</head>
<body>
<div class="nav">
<a href="/pdf-merge/" class="brand">工具集</a>
<a href="/pdf-merge/">PDF合并</a>
<a href="/pdf-merge/pdf-split.html">PDF拆分</a>
<a href="/pdf-merge/image-compress.html">图片压缩</a>
<a href="/pdf-merge/json-formatter.html">JSON格式化</a>
<a href="/pdf-merge/qr-generator.html">二维码生成</a>
<a href="/pdf-merge/markdown-editor.html">Markdown</a>
<a href="/pdf-merge/base64.html">Base64</a>
<a href="/pdf-merge/timestamp.html">时间戳</a>
</div>

<div class="container">
<h1>Base64 编解码</h1>
<p class="sub">文字转Base64 / Base64还原 &mdash; 浏览器本地处理</p>

<div class="tabs"><button class="active" onclick="switchTab('encode')">编码 (Encode)</button><button onclick="switchTab('decode')">解码 (Decode)</button></div>

<div id="encodeSection">
<div class="io-box"><label>输入文字</label><textarea id="encodeInput" placeholder="输入要编码的文字..."></textarea></div>
<div class="actions"><button class="btn btn-primary" onclick="doEncode()">编码 → Base64</button></div>
<div class="io-box"><label>Base64 结果</label><textarea id="encodeOutput" placeholder="编码结果..." readonly></textarea></div>
<div class="actions"><button class="btn btn-accent" onclick="copyText('encodeOutput')">复制结果</button></div>
</div>

<div id="decodeSection" style="display:none">
<div class="io-box"><label>Base64 字符串</label><textarea id="decodeInput" placeholder="输入Base64字符串..."></textarea></div>
<div class="actions"><button class="btn btn-primary" onclick="doDecode()">解码 → 文本</button></div>
<div class="io-box"><label>解码结果</label><textarea id="decodeOutput" placeholder="解码结果..." readonly></textarea></div>
<div class="actions"><button class="btn btn-accent" onclick="copyText('decodeOutput')">复制结果</button></div>
</div>

</div>

<footer class="footer"><p>所有处理在浏览器本地完成</p></footer>

<script>
function switchTab(tab) {
document.querySelectorAll(".tabs button").forEach((b,i)=>{b.classList.toggle("active",(tab==="encode"&&i===0)||(tab==="decode"&&i===1))});
document.getElementById("encodeSection").style.display=tab==="encode"?"block":"none";
document.getElementById("decodeSection").style.display=tab==="decode"?"block":"none";
}
function doEncode(){try{document.getElementById("encodeOutput").value=btoa(unescape(encodeURIComponent(document.getElementById("encodeInput").value)))}catch(e){document.getElementById("encodeOutput").value="编码失败: "+e.message}}
function doDecode(){try{document.getElementById("decodeOutput").value=decodeURIComponent(escape(atob(document.getElementById("decodeInput").value.trim())))}catch(e){document.getElementById("decodeOutput").value="解码失败: 请检查输入是否为有效Base64"}}
function copyText(id){const el=document.getElementById(id);el.select();navigator.clipboard.writeText(el.value).catch(()=>{})}
</script>
</body>
</html>
