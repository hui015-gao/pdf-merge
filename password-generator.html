<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="在线密码生成器，生成随机安全密码，支持自定义长度和字符类型。">
<title>密码生成器 - 随机安全密码</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:560px;margin:0 auto;padding:32px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:24px}
.result-box{background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;display:flex;gap:10px;align-items:center}
.result-box input{flex:1;padding:12px;border:2px solid #e8eaed;border-radius:6px;font-size:1.2rem;font-family:"SF Mono",Monaco,Consolas,monospace;outline:none;text-align:center}
.result-box input:focus{border-color:#1a73e8}
.options{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px}
.options label{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:.9rem;cursor:pointer}
.options label span{flex:1}
.options input[type="range"]{width:150px}
.options input[type="number"]{width:60px;padding:4px 8px;border:1px solid #dadce0;border-radius:4px;text-align:center}
.options input[type="checkbox"]{width:18px;height:18px;cursor:pointer}
.actions{display:flex;gap:10px;justify-content:center}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}
.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}
.btn-secondary:hover{background:#f0f0f0}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
</style>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container">
<h1>密码生成器</h1>
<div class="result-box"><input type="text" id="output" readonly value=""><button class="btn btn-accent" onclick="copyPwd()">复制</button></div>
<div class="options">
<label><span>密码长度</span><input type="range" id="lenRange" min="8" max="64" value="16" oninput="syncLen()"><input type="number" id="lenNum" min="8" max="64" value="16" oninput="syncRange()"></label>
<label><input type="checkbox" id="chkUpper" checked><span>大写字母</span></label>
<label><input type="checkbox" id="chkLower" checked><span>小写字母</span></label>
<label><input type="checkbox" id="chkDigits" checked><span>数字</span></label>
<label><input type="checkbox" id="chkSymbols" checked><span>特殊符号</span></label>
</div>
<div class="actions"><button class="btn btn-primary" onclick="generate()">生成新密码</button><button class="btn btn-secondary" onclick="generate()">刷新</button></div>
</div>
<footer class="footer"><p>密码在浏览器本地生成，不会上传</p></footer>
<script>
function syncLen(){var v=document.getElementById("lenRange").value;document.getElementById("lenNum").value=v;generate()}
function syncRange(){var v=document.getElementById("lenNum").value;document.getElementById("lenRange").value=v;generate()}
function generate(){
var len=parseInt(document.getElementById("lenNum").value)||16;
var chars="";
if(document.getElementById("chkUpper").checked)chars+="ABCDEFGHJKLMNPQRSTUVWXYZ";
if(document.getElementById("chkLower").checked)chars+="abcdefghijkmnopqrstuvwxyz";
if(document.getElementById("chkDigits").checked)chars+="23456789";
if(document.getElementById("chkSymbols").checked)chars+="!@#$%^&*_-+=?";
if(!chars){document.getElementById("output").value="请至少选择一种字符类型";return}
var arr=new Uint32Array(len);crypto.getRandomValues(arr);
var pwd="";for(var i=0;i<len;i++)pwd+=chars[arr[i]%chars.length];
document.getElementById("output").value=pwd;
}
function copyPwd(){var el=document.getElementById("output");navigator.clipboard.writeText(el.value);el.select()}
generate();
</script>
</body>
</html>
