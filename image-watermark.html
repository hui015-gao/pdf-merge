<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在线图片水印 - 添加文字水印</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:800px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#5f6368;font-size:.9rem;margin-bottom:20px}
.dropzone{border:2px dashed #d2d6dc;border-radius:8px;padding:32px;text-align:center;background:#fff;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:16px}
.dropzone:hover,.dropzone.dragover{border-color:#1a73e8;background:#f0f7ff}
.dropzone svg{width:36px;height:36px;color:#5f6368;margin-bottom:6px}
.dropzone .text{font-size:.95rem;color:#333}
.workspace{display:none;gap:20px}
.workspace.show{display:grid;grid-template-columns:1fr 1fr}
.preview-box{background:#fff;border-radius:8px;padding:20px;text-align:center}
.preview-box canvas{max-width:100%;max-height:350px;border:1px solid #e8eaed;border-radius:4px}
.controls{background:#fff;border-radius:8px;padding:20px}
.controls label{display:block;font-size:.85rem;color:#5f6368;margin-bottom:4px}
.controls input[type=text],.controls select{padding:8px 12px;border:1px solid #dadce0;border-radius:6px;font-size:.9rem;width:100%;margin-bottom:12px;font-family:inherit}
.controls input[type=range]{width:100%;margin-bottom:4px}
.controls .range-val{text-align:right;font-size:.8rem;color:#80868b;margin-bottom:10px}
.controls .pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.controls .pos-grid button{padding:8px;border:1px solid #dadce0;background:#fff;border-radius:4px;cursor:pointer;font-size:.8rem;font-family:inherit;transition:background .15s}
.controls .pos-grid button:hover,.controls .pos-grid button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-primary{background:#1a73e8;color:#fff}.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}.btn-secondary:hover{background:#f0f0f0}
.file-input{display:none}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
@media(max-width:600px){.workspace.show{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container"><h1>图片水印处理</h1>
<p class="sub">添加文字水印 &mdash; 浏览器本地处理</p>
<div class="dropzone" id="dropzone">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
<div class="text">拖入图片 / 点击选择</div>
<input type="file" class="file-input" id="fileInput" accept="image/*">
</div>
<div class="workspace" id="workspace">
<div class="preview-box"><canvas id="canvas"></canvas></div>
<div class="controls">
<label>水印文字</label><input type="text" id="wmText" value="水印" oninput="drawWatermark()">
<label>字体大小</label><input type="range" id="wmSize" min="10" max="120" value="36" oninput="drawWatermark()"><div class="range-val" id="sizeVal">36px</div>
<label>透明度</label><input type="range" id="wmOpacity" min="5" max="100" value="30" oninput="drawWatermark()"><div class="range-val" id="opacityVal">30%</div>
<label>颜色</label><input type="color" id="wmColor" value="#ffffff" oninput="drawWatermark()" style="width:60px;height:36px;border:none;cursor:pointer">
<label>位置</label>
<div class="pos-grid" id="posGrid">
<button onclick="setPos('tl')" data-pos="tl">左上</button><button onclick="setPos('tc')" data-pos="tc">中上</button><button onclick="setPos('tr')" data-pos="tr">右上</button>
<button onclick="setPos('ml')" data-pos="ml">左中</button><button onclick="setPos('mc')" data-pos="mc" class="active">正中</button><button onclick="setPos('mr')" data-pos="mr">右中</button>
<button onclick="setPos('bl')" data-pos="bl">左下</button><button onclick="setPos('bc')" data-pos="bc">中下</button><button onclick="setPos('br')" data-pos="br">右下</button>
</div>
</div>
<div class="actions"><button class="btn btn-accent" onclick="downloadImage()">下载水印图片</button><button class="btn btn-secondary" id="clearBtn">更换图片</button></div>
</div>
</div>
<footer class="footer"><p>图片在浏览器本地处理，不会上传</p></footer>
<script>
var img=null,currentPos="mc",workspace=document.getElementById("workspace"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
document.getElementById("dropzone").addEventListener("click",function(){document.getElementById("fileInput").click()});
document.getElementById("fileInput").addEventListener("change",function(e){e.target.files.length&&loadImage(e.target.files[0])});
document.getElementById("dropzone").addEventListener("dragover",function(e){e.preventDefault();this.classList.add("dragover")});
document.getElementById("dropzone").addEventListener("dragleave",function(){this.classList.remove("dragover")});
document.getElementById("dropzone").addEventListener("drop",function(e){e.preventDefault();this.classList.remove("dragover");e.dataTransfer.files.length&&loadImage(e.dataTransfer.files[0])});
function loadImage(file){var r=new FileReader();r.onload=function(e){img=new Image();img.onload=function(){drawWatermark();workspace.classList.add("show")};img.src=e.target.result};r.readAsDataURL(file)}
function drawWatermark(){if(!img)return;var maxW=600,cw=img.width,ch=img.height,ratio=Math.min(maxW/cw,1);cw*=ratio;ch*=ratio;canvas.width=cw;canvas.height=ch;ctx.clearRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);var text=document.getElementById("wmText").value||"Watermark";var size=(parseInt(document.getElementById("wmSize").value)/100)*cw;document.getElementById("sizeVal").textContent=Math.round(size)+"px";var opacity=parseInt(document.getElementById("wmOpacity").value)/100;document.getElementById("opacityVal").textContent=Math.round(opacity*100)+"%";var color=document.getElementById("wmColor").value;var r=parseInt(color.substring(1,3),16),g=parseInt(color.substring(3,5),16),b=parseInt(color.substring(5,7),16);ctx.font="bold "+size+"px -apple-system,sans-serif";ctx.fillStyle="rgba("+r+","+g+","+b+","+opacity+")";ctx.textAlign="center";var metrics=ctx.measureText(text),tw=metrics.width,th=size;var margin=10,x,y;var posMap={tl:margin+tw/2,mc:cw/2};x=posMap[currentPos]||cw/2;switch(currentPos[0]){case"t":y=th+margin;break;case"m":y=ch/2;break;case"b":y=ch-margin;break}ctx.fillText(text,x,y)}
function setPos(pos){currentPos=pos;var btns=document.getElementById("posGrid").querySelectorAll("button");btns.forEach(function(b){b.classList.toggle("active",b.dataset.pos===pos)});drawWatermark()}
function downloadImage(){var a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download="watermarked.png";a.click()}
document.getElementById("clearBtn").addEventListener("click",function(){img=null;workspace.classList.remove("show");document.getElementById("fileInput").value=""})
</script></body></html>
