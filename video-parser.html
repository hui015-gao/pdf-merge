<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>视频链接解析 - B站视频信息提取</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:700px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#5f6368;font-size:.9rem;margin-bottom:20px}
.tabs{display:flex;justify-content:center;gap:0;margin-bottom:20px}
.tabs button{padding:8px 24px;border:1px solid #dadce0;background:#fff;font-size:.9rem;cursor:pointer;font-family:inherit;transition:background .15s}
.tabs button:first-child{border-radius:6px 0 0 6px}
.tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.search-box{display:flex;gap:8px;margin-bottom:20px}
.search-box input{flex:1;padding:12px;border:2px solid #e8eaed;border-radius:8px;font-size:.95rem;outline:none;font-family:inherit;transition:border-color .2s}
.search-box input:focus{border-color:#1a73e8}
.search-box button{padding:12px 24px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.search-box button:hover{background:#1557b0}
.search-box button:disabled{background:#a8c7fa;cursor:not-allowed}
.result-card{display:none;background:#fff;border-radius:8px;overflow:hidden}
.result-card.show{display:block}
.result-card .cover{width:100%;max-height:300px;object-fit:cover;background:#e8eaed}
.result-card .info{padding:20px}
.result-card .title{font-size:1.15rem;font-weight:700;margin-bottom:8px;line-height:1.5}
.result-card .meta{display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem;color:#5f6368}
.result-card .meta span{display:flex;align-items:center;gap:4px}
.result-card .desc{margin-top:12px;font-size:.85rem;color:#80868b;line-height:1.6;max-height:80px;overflow:hidden}
.result-card .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.notice{background:#fff3e0;border-radius:8px;padding:16px;margin-top:16px;text-align:center;color:#e65100;font-size:.85rem;line-height:1.6}
.error{color:#d93025;text-align:center;margin-top:12px;font-size:.9rem}
.loading{text-align:center;color:#5f6368;margin-top:12px;font-size:.9rem}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-accent{background:#0d904f;color:#fff}.btn-accent:hover{background:#0a773e}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
@media(max-width:500px){.search-box{flex-direction:column}}
</style>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container"><h1>视频链接解析</h1>
<p class="sub">提取B站视频信息</p>
<div class="tabs"><button class="active" onclick="switchPlatform('bilibili')">B站</button><button onclick="switchPlatform('douyin')">抖音</button></div>
<div id="biliSection">
<div class="search-box"><input type="text" id="biliInput" placeholder="粘贴B站视频链接 或 输入BV号..." value="https://www.bilibili.com/video/BV1xx411c7mD"><button id="biliBtn" onclick="fetchBili()">提取</button></div>
<div class="loading" id="biliLoading" style="display:none">正在获取视频信息...</div>
<div class="error" id="biliError"></div>
<div class="result-card" id="biliResult"><img class="cover" id="biliCover" alt=""><div class="info"><div class="title" id="biliTitle"></div><div class="meta" id="biliMeta"></div><div class="desc" id="biliDesc"></div><div class="actions"><button class="btn btn-accent" id="biliCopyLink" onclick="copyBiliLink()">复制链接</button></div></div></div>
</div>
<div id="douyinSection" style="display:none">
<div class="notice">抖音视频提取需要后端服务支持，目前暂不支持纯前端解析。<br>建议使用第三方的在线抖音去水印工具。</div>
</div></div>
<footer class="footer"><p>视频信息来自B站公开API，仅供学习参考</p></footer>
<script>
var biliData=null;
function switchPlatform(p){document.querySelectorAll(".tabs button")[0].classList.toggle("active",p==="bilibili");document.querySelectorAll(".tabs button")[1].classList.toggle("active",p==="douyin");document.getElementById("biliSection").style.display=p==="bilibili"?"block":"none";document.getElementById("douyinSection").style.display=p==="douyin"?"block":"none"}
async function fetchBili(){var inp=document.getElementById("biliInput").value.trim();var bvid="";var m=inp.match(/BV[0-9A-Za-z]{10}/);if(m)bvid=m[0];else{m=inp.match(/bv([0-9A-Za-z]{10})/i);if(m)bvid="BV"+m[1].toUpperCase()}if(!bvid){m=inp.match(/av(\d+)/i);if(m){var aid=parseInt(m[1]);if(aid){bvid="av"+aid}}}if(!bvid){document.getElementById("biliError").textContent="请输入有效的B站链接或BV号";return}
document.getElementById("biliError").textContent="";document.getElementById("biliLoading").style.display="block";document.getElementById("biliResult").classList.remove("show");document.getElementById("biliBtn").disabled=true;
try{var url="https://api.allorigins.win/raw?url="+encodeURIComponent("https://api.bilibili.com/x/web-interface/view?bvid="+bvid);var resp=await fetch(url,{headers:{"Referer":"https://www.bilibili.com"}});if(!resp.ok)throw new Error("请求失败");var data=await resp.json();if(data.code!==0)throw new Error(data.message||"获取失败");var v=data.data;biliData=v;document.getElementById("biliTitle").textContent=v.title;document.getElementById("biliMeta").innerHTML="<span>播放 "+formatNum(v.stat.view)+"</span><span>弹幕 "+formatNum(v.stat.danmaku)+"</span><span>时长 "+formatDuration(v.duration)+"</span><span>点赞 "+formatNum(v.stat.like)+"</span>";document.getElementById("biliDesc").textContent=v.desc||"暂无简介";document.getElementById("biliCover").src=v.pic.replace("http:","https:");document.getElementById("biliResult").classList.add("show")}catch(e){document.getElementById("biliError").textContent="获取失败: "+(e.message||"请检查链接或稍后重试");console.error(e)}finally{document.getElementById("biliLoading").style.display="none";document.getElementById("biliBtn").disabled=false}
}
function formatNum(n){if(!n)return"0";if(n>=10000)return(n/10000).toFixed(1)+"万";return n.toLocaleString()}
function formatDuration(s){if(!s)return"00:00";var m=Math.floor(s/60),sec=s%60;return m+":"+sec.toString().padStart(2,"0")}
function copyBiliLink(){if(biliData) navigator.clipboard.writeText("https://www.bilibili.com/video/"+biliData.bvid)}
</script></body></html>
