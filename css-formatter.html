<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS格式化/压缩</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:800px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#5f6368;font-size:.9rem;margin-bottom:16px}
textarea{width:100%;padding:14px;border:1px solid #dadce0;border-radius:8px;font-family:"SF Mono",Monaco,Consolas,monospace;font-size:.85rem;line-height:1.6;resize:vertical;min-height:200px;outline:none;margin-bottom:12px}
textarea:focus{border-color:#1a73e8}
.actions{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.btn{padding:10px 24px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-primary{background:#1a73e8;color:#fff}.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}.btn-secondary:hover{background:#f0f0f0}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
</style></head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container"><h1>CSS 格式化 / 压缩</h1>
<p class="sub">美化或压缩 CSS 代码</p>
<textarea id="input" placeholder="粘贴CSS代码...">body{font-size:16px;color:#333;margin:0}h1{font-weight:bold;color:#222}.container{max-width:960px;padding:0 20px}</textarea>
<div class="actions"><button class="btn btn-primary" onclick="beautify()">美化 (Beautify)</button><button class="btn btn-secondary" onclick="minify()">压缩 (Minify)</button><button class="btn btn-accent" onclick="copyOutput()">复制</button><button class="btn btn-secondary" onclick="clearAll()">清空</button></div>
<textarea id="output" placeholder="结果..." readonly></textarea></div>
<footer class="footer"><p>CSS处理在浏览器本地完成</p></footer>
<script>
var inp=document.getElementById("input"),out=document.getElementById("output");
function beautify(){var css=inp.value;css=css.replace(/\s*,\s*/g,", ").replace(/\s*\{\s*/g," {\n  ").replace(/\s*}\s*/g,"\n}\n").replace(/;\s*/g,";\n  ").replace(/\n\s*\n/g,"\n").trim();css=css.replace(/;(\s*\n\s*)}/g,";\n}");out.value=css}
function minify(){out.value=inp.value.replace(/\/\*[\s\S]*?\*\//g,"").replace(/\s+/g," ").replace(/\s*([{};:,>+~])\s*/g,"$1").replace(/;}/g,"}").trim()}
function copyOutput(){out.select();navigator.clipboard.writeText(out.value)}
function clearAll(){inp.value="";out.value=""}
</script></body></html>
