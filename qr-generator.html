<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="免费在线二维码生成器，输入文字或链接即可生成二维码并下载PNG。">
<title>在线二维码生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:0 24px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;gap:5px;padding:14px 16px;text-decoration:none;color:#5f6368;font-size:.9rem;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.nav a:hover{color:#1a73e8}
.nav a.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.nav .brand{font-weight:700;font-size:1rem;color:#1a1a1a;margin-right:16px;padding:14px 8px}
.container{max-width:600px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#5f6368;font-size:.9rem;margin-bottom:20px}
.input-group{background:#fff;border-radius:8px;padding:20px}
.input-group textarea{width:100%;padding:12px;border:2px solid #e8eaed;border-radius:6px;font-size:.95rem;resize:vertical;min-height:80px;outline:none;font-family:inherit;transition:border-color .2s}
.input-group textarea:focus{border-color:#1a73e8}
.input-group .hint{font-size:.8rem;color:#80868b;margin-top:4px}
.actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-accent{background:#0d904f;color:#fff}
.btn-accent:hover{background:#0a773e}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}
.btn-secondary:hover{background:#f0f0f0}
.result-area{display:none;margin-top:20px;text-align:center}
.result-area.show{display:block}
.result-area img{max-width:260px;margin:0 auto}
.download-actions{display:none;margin-top:16px;gap:10px;justify-content:center}
.download-actions.show{display:flex}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
@media(max-width:600px){.container{padding:16px 10px}}
</style>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>

<div class="container">
<h1>在线二维码生成器</h1>
<p class="sub">输入文字或链接，即时生成二维码</p>

<div class="input-group">
<textarea id="input" placeholder="输入文字、网址或任意内容..." maxlength="2000" oninput="generateQR()"></textarea>
<div class="hint" id="charCount">0 / 2000</div>
</div>

<div class="actions">
<button class="btn btn-primary" onclick="generateQR()">生成二维码</button>
</div>

<div class="result-area" id="resultArea"><div id="qrContainer"></div></div>

<div class="download-actions" id="downloadActions">
<button class="btn btn-accent" onclick="downloadPNG()">下载 PNG</button>
<button class="btn btn-secondary" onclick="downloadSVG()">下载 SVG</button>
</div>
</div>

<footer class="footer"><p>二维码在浏览器本地生成，内容不会上传</p></footer>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var qrDataURL = "";

document.getElementById("input").addEventListener("input", function(){
document.getElementById("charCount").textContent = this.value.length + " / 2000";
});

function generateQR(){
var text = document.getElementById("input").value.trim();
if(!text) return;
try {
var qr = qrcode(0, "M");
qr.addData(text);
qr.make();
var imgHtml = qr.createImgTag(5);
document.getElementById("qrContainer").innerHTML = imgHtml;
qrDataURL = qr.createDataURL(10);
document.getElementById("resultArea").classList.add("show");
document.getElementById("downloadActions").classList.add("show");
} catch(e) {
alert("生成失败，请检查输入内容");
}
}

function downloadPNG(){
var a = document.createElement("a");
a.href = qrDataURL;
a.download = "qrcode.png";
a.click();
}

function downloadSVG(){
try {
var text = document.getElementById("input").value.trim();
if(!text) return;
var qr = qrcode(0, "M");
qr.addData(text);
qr.make();
var svg = qr.createSvgTag(10);
var blob = new Blob([svg], {type:"image/svg+xml"});
var a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "qrcode.svg";
a.click();
} catch(e) { alert("SVG生成失败"); }
}
</script>
</body>
</html>
