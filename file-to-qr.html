<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文件转二维码 - 上传即生成</title>
<link rel="stylesheet" href="style.css">
<style>
.container{max-width:640px;margin:0 auto;padding:24px 20px}
h1{font-size:1.5rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#64748b;font-size:.88rem;margin-bottom:24px}
.dropzone{border:2px dashed #d2d6dc;border-radius:12px;padding:48px 24px;text-align:center;background:#fff;cursor:pointer;transition:all .2s;margin-bottom:16px}
.dropzone:hover,.dropzone.dragover{border-color:#6366f1;background:#f0f7ff}
.dropzone .icon{font-size:2.5rem;margin-bottom:8px}
.dropzone .text{font-size:.95rem;color:#333;margin-bottom:4px}
.dropzone .hint{font-size:.8rem;color:#94a3b8}
.file-preview{display:none;background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;text-align:center}
.file-preview.show{display:block}
.file-preview img{max-width:100%;max-height:240px;border-radius:8px;margin-bottom:8px}
.file-preview .info{font-size:.88rem;color:#555;margin-top:4px}
.upload-progress{display:none;margin:12px 0}
.upload-progress.show{display:block}
.upload-progress .bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.upload-progress .bar .fill{height:100%;background:#6366f1;border-radius:3px;width:0;transition:width .3s}
.upload-progress .text{text-align:center;font-size:.82rem;color:#888;margin-top:4px}
.qr-result{display:none;text-align:center;margin-top:20px}
.qr-result.show{display:block}
.qr-result canvas,.qr-result img{max-width:260px;border:12px solid #fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.result-url{background:#f8f9fb;padding:10px 14px;border-radius:8px;font-size:.82rem;color:#555;margin-top:12px;word-break:break-all;font-family:SF Mono,Monaco,monospace}
.actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.notice{background:#fff3e0;border-radius:8px;padding:14px;margin-top:20px;font-size:.82rem;color:#e65100;line-height:1.6}
</style>
</head>
<body>
<div class="nav-back"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container">
<h1>文件转二维码</h1>
<p class="sub">上传文件 &rarr; 托管到云端 &rarr; 生成二维码 &rarr; 扫码下载</p>

<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
<div class="icon">📤</div>
<div class="text">点击选择文件 或 拖拽到此处</div>
<div class="hint">图片 / PDF / 文档 &middot; 最大 5MB</div>
<input type="file" id="fileInput" class="file-input" onchange="handleFile(this.files[0])">
</div>

<div class="file-preview" id="preview"><img id="previewImg" alt=""><div class="info" id="previewInfo"></div></div>

<div class="upload-progress" id="progress"><div class="bar"><div class="fill" id="progressFill"></div></div><div class="text" id="progressText"></div></div>

<div class="qr-result" id="qrResult"><div id="qrContainer"></div><div class="result-url" id="resultUrl"></div></div>

<div class="actions"><button class="btn btn-success" id="downloadQR" style="display:none" onclick="downloadQRPNG()">下载二维码</button></div>

<div class="notice">文件上传到 GitHub 云端托管，生成公开下载链接。扫码即可下载文件。文件长期有效。</div>
</div>
<footer class="footer"><p>上传通过安全连接，文件公开可访问</p></footer>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
<script src="auth-config.js"></script>
<script src="auth-check.js"></script>
<script>
const dz = document.getElementById("dropzone"), fi = document.getElementById("fileInput");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover") });
dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("dragover"); if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]) });

let uploadedUrl = "";

async function handleFile(file) {
  if (!file) return;
  if (file.size > 5*1024*1024) { alert("文件不能超过 5MB"); return; }

  // Preview
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  const previewInfo = document.getElementById("previewInfo");
  preview.classList.add("show");
  previewInfo.textContent = file.name + " (" + (file.size/1024).toFixed(1) + " KB)";

  if (file.type.startsWith("image/")) {
    const r = new FileReader();
    r.onload = e => { previewImg.src = e.target.result; previewImg.style.display = "block" };
    r.readAsDataURL(file);
  } else {
    previewImg.style.display = "none";
  }

  // Upload
  const progress = document.getElementById("progress");
  const progressFill = document.getElementById("progressFill");
  const progressText = document.getElementById("progressText");
  progress.classList.add("show");
  progressFill.style.width = "10%"; progressText.textContent = "正在上传...";

  try {
    const ts = new Date().toISOString().replace(/[:.]/g,"-");
    const path = "uploads/" + ts + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    
    progressFill.style.width = "50%";
    const token = AUTH_CONFIG.githubToken;
    const resp = await fetch("https://api.github.com/repos/hui015-gao/pdf-merge/contents/" + path, {
      method: "PUT",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Upload: " + file.name, content: base64, branch: "master" })
    });
    
    if (!resp.ok) { const err = await resp.json(); throw new Error(err.message || "Upload failed") }
    
    const data = await resp.json();
    uploadedUrl = data.content.download_url;
    progressFill.style.width = "100%"; progressText.textContent = "上传成功!";
    
    // QR
    document.getElementById("qrContainer").innerHTML = "";
    new QRCode(document.getElementById("qrContainer"), {
      text: uploadedUrl, width: 260, height: 260,
      correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById("resultUrl").textContent = uploadedUrl;
    document.getElementById("qrResult").classList.add("show");
    document.getElementById("downloadQR").style.display = "inline-flex";
    
  } catch(e) {
    progressText.textContent = "上传失败: " + (e.message || "网络错误");
  }
}

function downloadQRPNG() {
  const canvas = document.getElementById("qrContainer").querySelector("canvas");
  const img = document.getElementById("qrContainer").querySelector("img");
  if (canvas) { const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "qrcode.png"; a.click(); }
  else if (img) { const a = document.createElement("a"); a.href = img.src; a.download = "qrcode.png"; a.click(); }
}
</script>
</body></html>
