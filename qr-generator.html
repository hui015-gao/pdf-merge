<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二维码生成器</title>
<link rel="stylesheet" href="style.css">
<style>
.container{max-width:640px;margin:0 auto;padding:24px 20px}
h1{font-size:1.5rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#64748b;font-size:.88rem;margin-bottom:20px}
.mode-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.mode-tabs button{padding:8px 16px;border:2px solid #e2e8f0;background:#fff;border-radius:8px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .15s}
.mode-tabs button.active{background:#6366f1;color:#fff;border-color:#6366f1}
.input-area{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #eee}
textarea{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:.9rem;min-height:80px;resize:vertical;outline:none;font-family:inherit;line-height:1.6}
textarea:focus{border-color:#6366f1}
.hint{font-size:.78rem;color:#94a3b8;margin-top:6px;line-height:1.5}
.dropzone{border:2px dashed #d2d6dc;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.dropzone:hover,.dropzone.dragover{border-color:#6366f1;background:#f0f7ff}
.dropzone svg{width:36px;height:36px;color:#5f6368;margin-bottom:8px}
.preview{text-align:center;margin:20px 0;min-height:180px;display:flex;align-items:center;justify-content:center}
#qrContainer canvas,#qrContainer img{max-width:280px;border:12px solid #fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.info-box{background:#eff6ff;border-radius:8px;padding:14px 18px;margin-top:12px;font-size:.85rem;color:#1e40af;line-height:1.6}
.info-box code{background:#dbeafe;padding:2px 6px;border-radius:4px;font-size:.82rem}
.actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.status{text-align:center;color:#64748b;font-size:.88rem;min-height:22px;margin-top:8px}
</style>
</head>
<body>
<div class="nav-back"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container">
<h1>二维码生成器</h1>
<p class="sub">文本 / 网址 / 分享链接 / 上传文件 &middot; 微信可扫</p>

<div class="mode-tabs">
<button id="tabText" class="active" onclick="switchMode('text')">文本</button>
<button id="tabUrl" onclick="switchMode('url')">网址链接</button>
<button id="tabLink" onclick="switchMode('link')">分享链接</button>
<button id="tabUpload" onclick="switchMode('upload')">上传文件</button>
</div>

<!-- Text Mode -->
<div class="input-area" id="modeText">
<textarea id="inputText" placeholder="输入文字内容..." oninput="genQR()">你好！微信扫码查看这段文字</textarea>
<div class="hint">文本模式：微信扫码跳转猫猫页面显示文字</div>
</div>

<!-- URL Mode -->
<div class="input-area" id="modeUrl" style="display:none">
<textarea id="inputUrl" placeholder="粘贴网址，如 https://example.com" oninput="genQR()"></textarea>
<div class="hint">网址模式：微信扫码打开网页</div>
</div>

<!-- Link Mode -->
<div class="input-area" id="modeLink" style="display:none">
<textarea id="inputLink" placeholder="粘贴网盘分享链接" oninput="genQR()"></textarea>
<div class="hint">把文件上传到网盘，粘贴分享链接即可</div>
</div>

<!-- Upload Mode -->
<div class="input-area" id="modeUpload" style="display:none">
<div class="dropzone" id="uplDz" onclick="document.getElementById('uplFile').click()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
<div style="font-size:.95rem;margin:8px 0 4px">选择文件 或 拖拽</div>
<div style="font-size:.78rem;color:#94a3b8">图片/PDF/文档 &middot; 最大50MB</div>
<button class="btn btn-primary" style="margin-top:12px;pointer-events:none">选择文件</button>
</div>
<input type="file" id="uplFile" class="file-input" onchange="doUpload(this.files[0])">
<div class="status" id="uplStatus"></div>
</div>

<div class="preview"><div id="qrContainer"></div></div>
<div class="info-box" id="infoBox" style="display:none"></div>
<div class="actions"><button class="btn btn-success" onclick="downloadPNG()">下载 PNG</button></div>
</div>
<footer class="footer"><p>文件上传至Gitee托管 &middot; 二维码浏览器本地生成</p></footer>

<script src="qrcode.min.js"></script>
<script src="auth-config.js"></script>
<script src="auth-check.js"></script>
<script>
let mode = "text";
let qrInstance = null;

function switchMode(m) {
  mode = m;
  ["text","url","link","upload"].forEach((k,i) => {
    document.getElementById("tab"+["Text","Url","Link","Upload"][i]).classList.toggle("active", k===m);
    document.getElementById("mode"+["Text","Url","Link","Upload"][i]).style.display = k===m ? "block" : "none";
  });
  if (m !== "upload") genQR();
}

function getContent() {
  if (mode === "text") return document.getElementById("inputText").value.trim();
  if (mode === "url") return document.getElementById("inputUrl").value.trim();
  if (mode === "link") return document.getElementById("inputLink").value.trim();
  return null;
}

function genQR() {
  if (mode === "upload") return;
  const text = getContent();
  const c = document.getElementById("qrContainer");
  const info = document.getElementById("infoBox");
  c.innerHTML = ""; qrInstance = null; info.style.display = "none";
  if (!text) return;

  let qrText = text;
  if (mode === "text") {
    qrText = "https://hui015-gao.github.io/pdf-merge/qr-view.html#" + encodeURIComponent(text);
  }

  try {
    qrInstance = new QRCode(c, { text: qrText, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.H });
    info.style.display = "block";
    if (mode === "text") info.innerHTML = "<strong>微信扫描：</strong>打开猫猫页面显示文字";
    else if (mode === "url") info.innerHTML = "<strong>微信扫描：</strong>打开网页";
    else info.innerHTML = "<strong>微信扫描：</strong>跳转到分享链接";
  } catch(e) { c.innerHTML = '<div style="color:#ef4444;padding:20px">内容过长</div>'; }
}

async function doUpload(file) {
  if (!file) return;
  if (file.size > 50*1024*1024) { document.getElementById("uplStatus").textContent = "文件不能超过50MB"; return; }
  const st = document.getElementById("uplStatus");
  st.textContent = "上传中...";

  try {
    const ts = new Date().toISOString().replace(/[:.]/g,"-");
    const path = "uploads/" + ts + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const base64 = await new Promise((res,rej) => {
      const r = new FileReader(); r.onload = e => res(e.target.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(file);
    });
    const resp = await fetch("https://api.github.com/repos/hui015-gao/pdf-merge/contents/" + path, {
      method: "PUT",
      headers: { "Authorization": "token " + AUTH_CONFIG.githubToken, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Upload: " + file.name, content: base64, branch: "master" })
    });
    if (!resp.ok) { const er = await resp.json(); throw new Error(er.message || "Upload failed"); }
    const data = await resp.json();
    const url = data.content.download_url;
    st.innerHTML = "上传成功! <a href=\"" + url + "\" target=\"_blank\" style=\"color:#6366f1\">查看</a>";

    document.getElementById("qrContainer").innerHTML = "";
    const dlUrl = "https://hui015-gao.github.io/pdf-merge/dl.html?u=" + encodeURIComponent(url);
    qrInstance = new QRCode(document.getElementById("qrContainer"), {
      text: dlUrl, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById("infoBox").style.display = "block";
    document.getElementById("infoBox").innerHTML = "<strong>扫码下载：</strong>" + file.name + " (" + (file.size/1024).toFixed(0) + "KB)";
  } catch(e) {
    st.textContent = "上传失败: " + (e.message || "网络错误");
  }
}

function downloadPNG() {
  const c = document.getElementById("qrContainer").querySelector("canvas");
  const i = document.getElementById("qrContainer").querySelector("img");
  const src = c ? c.toDataURL("image/png") : (i ? i.src : null);
  if (!src) return;
  const a = document.createElement("a"); a.href = src; a.download = "qrcode.png"; a.click();
}

// Drag/drop for upload
const dz = document.getElementById("uplDz");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("dragover"); if(e.dataTransfer.files.length) doUpload(e.dataTransfer.files[0]); });

genQR();
</script>
</body></html>
