<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>日期间隔计算器</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:12px 24px;border-bottom:1px solid #e8eaed}
.nav a{color:#1a73e8;text-decoration:none;font-size:.9rem}
.container{max-width:560px;margin:0 auto;padding:24px 20px;flex:1}
h1{font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:20px}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px;color:#1a1a1a}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row input[type=date]{padding:8px 12px;border:1px solid #dadce0;border-radius:6px;font-size:.9rem;font-family:inherit;flex:1;min-width:140px}
.row input[type=number]{width:80px;padding:8px 12px;border:1px solid #dadce0;border-radius:6px;font-size:.9rem;text-align:center;font-family:inherit}
.result{padding:10px 16px;background:#f0f7ff;border-radius:6px;font-size:1rem;text-align:center;margin-top:8px;font-weight:600;color:#1a73e8}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;background:#1a73e8;color:#fff;transition:background .15s}
.btn:hover{background:#1557b0}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
</style><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>
<div class="container"><h1>日期间隔计算器</h1>
<div class="card"><h3>计算两个日期之间的天数</h3>
<div class="row"><input type="date" id="d1"><span>至</span><input type="date" id="d2"><button class="btn" onclick="calcDiff()">计算</button></div>
<div class="result" id="diffResult"></div></div>
<div class="card"><h3>日期加减天数</h3>
<div class="row"><input type="date" id="d3"><span>±</span><input type="number" id="days" value="7" placeholder="天数"><button class="btn" onclick="calcAdd()">计算</button></div>
<div class="result" id="addResult"></div></div></div>
<footer class="footer"><p>所有运算在浏览器本地完成</p></footer>
<script>
var now=new Date().toISOString().slice(0,10);document.getElementById("d1").value=now;document.getElementById("d2").value=now;document.getElementById("d3").value=now;
function calcDiff(){var d1=new Date(document.getElementById("d1").value),d2=new Date(document.getElementById("d2").value);if(isNaN(d1)||isNaN(d2)){document.getElementById("diffResult").textContent="请选择有效日期";return}var diff=Math.abs(d2-d1)/86400000;document.getElementById("diffResult").textContent="间隔 "+Math.round(diff)+" 天"}
function calcAdd(){var d=new Date(document.getElementById("d3").value),nd=parseInt(document.getElementById("days").value)||0;if(isNaN(d)){document.getElementById("addResult").textContent="请选择有效日期";return}d.setDate(d.getDate()+nd);document.getElementById("addResult").textContent=d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0")+" ("+Math.abs(nd)+"天"+(nd>=0?"后":"前")+")"}
</script></body></html>
