<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员面板</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f4f5f7}
.admin-header{background:#1d1d1f;color:#fff;padding:14px 32px;display:flex;justify-content:space-between;align-items:center}
.admin-header h1{font-size:1.1rem;font-weight:700}
.admin-header button{padding:8px 20px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;font-size:.85rem;font-family:inherit}
.admin-header button:hover{background:rgba(255,255,255,.1)}
.container{max-width:680px;margin:0 auto;padding:32px 20px}
.card{background:#fff;border-radius:12px;padding:28px;margin-bottom:20px;border:1px solid #eee}
.card h3{font-size:1rem;margin-bottom:16px}
.form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.form-row input{padding:10px 14px;border:2px solid #e5e7eb;border-radius:8px;font-size:.9rem;flex:1;min-width:180px;font-family:inherit}
.form-row input:focus{border-color:#6366f1;outline:none}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:#6366f1;color:#fff}.btn-primary:hover{background:#4f46e5}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#059669}
.code-block{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:8px;font-family:SF Mono,Monaco,monospace;font-size:.82rem;line-height:1.6;overflow-x:auto;margin-top:12px;white-space:pre-wrap;word-break:break-all}
.info{color:#888;font-size:.85rem;margin-top:8px;line-height:1.6}
.success{color:#10b981;font-size:.88rem;margin-top:8px;font-weight:600}.error-msg{color:#ef4444;font-size:.88rem;margin-top:8px}
.stat-row{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#f8f9fb;padding:16px 24px;border-radius:10px;text-align:center;min-width:100px}
.stat .n{font-size:1.5rem;font-weight:800;color:#6366f1}.stat .l{font-size:.8rem;color:#888}
</style>
</head>
<body>
<div class="admin-header"><h1>管理员面板</h1><div><button onclick="logout()">退出</button></div></div>
<div class="container" id="main"></div>
<script src="auth-config.js"></script>
<script>
if (sessionStorage.getItem("role") !== "admin") { window.location.href = "login.html?admin=1&redirect=admin.html"; }

async function init() {
  let h = '<div class="stat-row"><div class="stat" style="flex:1"><div class="n">1</div><div class="l">共享密码</div></div><div class="stat" style="flex:1"><div class="n">' + AUTH_CONFIG.sharedPassword.length + '</div><div class="l">密码位数</div></div></div>';

  h += '<div class="card"><h3>修改用户共享密码</h3><div class="form-row"><input type="text" id="newPwd" placeholder="新密码（6位以上）"><button class="btn btn-primary" onclick="updatePassword()">生成新配置</button></div><div id="result"></div></div>';

  h += '<div class="card"><h3>当前配置</h3><div class="code-block" id="currentConfig"></div><div class="info">这是 auth-config.js 文件的内容。如果需要更新生效，复制上方代码替换 auth-config.js，推送到 GitHub。</div></div>';

  document.getElementById("main").innerHTML = h;
  document.getElementById("currentConfig").textContent = JSON.stringify({ adminHash: AUTH_CONFIG.adminHash, userHash: AUTH_CONFIG.userHash, sharedPassword: AUTH_CONFIG.sharedPassword }, null, 2);
}

async function updatePassword() {
  const pwd = document.getElementById("newPwd").value.trim();
  if (!pwd || pwd.length < 6) { document.getElementById("result").innerHTML = '<div class="error-msg">密码至少6位</div>'; return; }
  const hash = await sha256(pwd);
  const config = JSON.stringify({ adminHash: AUTH_CONFIG.adminHash, userHash: hash, sharedPassword: pwd }, null, 2);
  document.getElementById("result").innerHTML = '<div class="success">新密码哈希已生成</div><div class="code-block" style="margin-top:8px">' + config.replace(/</g, "&lt;") + '</div><div class="info">复制上面的代码，替换 auth-config.js，推送到 GitHub 即生效。</div>';
}

function logout() { sessionStorage.clear(); window.location.href = "login.html"; }
init();
</script>
</body></html>
