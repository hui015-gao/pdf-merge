<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="免费在线图片压缩工具，无需上传文件，完全在浏览器中处理，保护隐私。支持JPG/PNG/WebP格式。">
<title>在线图片压缩 - 免费、安全、无需上传</title>
<link rel="stylesheet" href="style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#333;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;padding:0 24px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;gap:5px;padding:14px 16px;text-decoration:none;color:#5f6368;font-size:.9rem;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.nav a:hover{color:#1a73e8}
.nav a.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.nav .brand{font-weight:700;font-size:1rem;color:#1a1a1a;margin-right:16px;padding:14px 8px}
.header{background:#fff;padding:16px 24px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between}
.header .logo{font-size:1.1rem;font-weight:700;color:#1a73e8}
.container{max-width:800px;margin:0 auto;padding:32px 20px;flex:1}
h1{font-size:1.6rem;color:#1a1a1a;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#5f6368;font-size:.95rem;margin-bottom:28px}
.sub span{color:#1a73e8;font-weight:600}
.dropzone{border:2px dashed #d2d6dc;border-radius:8px;padding:40px 24px;text-align:center;background:#fff;transition:border-color .2s,background .2s;cursor:pointer}
.dropzone:hover,.dropzone.dragover{border-color:#1a73e8;background:#f0f7ff}
.dropzone svg{width:40px;height:40px;color:#5f6368;margin-bottom:8px}
.dropzone .text{font-size:1rem;color:#333;margin-bottom:4px}
.dropzone .hint{font-size:.82rem;color:#80868b}
.preview-area{display:none;margin-top:20px;gap:20px}
.preview-area.show{display:grid;grid-template-columns:1fr 1fr}
.preview-card{background:#fff;border-radius:8px;padding:16px;text-align:center}
.preview-card .label{font-size:.85rem;color:#80868b;margin-bottom:8px}
.preview-card img{max-width:100%;max-height:280px;border-radius:4px;object-fit:contain}
.preview-card .size{font-size:.9rem;color:#333;margin-top:8px;font-weight:600}
.preview-card .size.saved{color:#0d904f}
.controls{margin-top:20px;background:#fff;border-radius:8px;padding:20px}
.controls label{display:block;font-size:.9rem;color:#5f6368;margin-bottom:6px}
.controls input[type=range]{width:100%;margin-bottom:12px}
.controls .range-labels{display:flex;justify-content:space-between;font-size:.8rem;color:#80868b;margin-top:-8px;margin-bottom:16px}
.controls select{padding:8px 12px;border:1px solid #dadce0;border-radius:6px;font-size:.9rem;margin-bottom:12px;cursor:pointer}
.actions{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-primary:disabled{background:#a8c7fa;cursor:not-allowed}
.btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0}
.btn-secondary:hover{background:#f0f0f0}
.file-input{display:none}
.footer{text-align:center;padding:24px 20px;color:#80868b;font-size:.82rem;border-top:1px solid #e8eaed;margin-top:auto}
.stats{display:flex;gap:20px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stats div{background:#fff;padding:12px 20px;border-radius:8px;text-align:center}
.stats div .num{font-size:1.3rem;font-weight:700;color:#1a73e8}
.stats div .lbl{font-size:.8rem;color:#80868b}
@media(max-width:600px){
.container{padding:16px 10px}
.preview-area.show{grid-template-columns:1fr}
.nav a{padding:10px;font-size:.8rem}
.nav .brand{margin-right:0}
h1{font-size:1.3rem}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.2/dist/av-min.js"></script>
<script src="leancloud-config.js"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="nav"><a href="/pdf-merge/">&larr; 返回工具集</a></div>

<div class="nav" id="nav">
<a href="/pdf-merge/" class="brand">工具集</a>
<a href="/pdf-merge/">PDF合并</a>
<a href="/pdf-merge/image-compress.html" class="active">图片压缩</a>
<a href="/pdf-merge/json-formatter.html">JSON格式化</a>
<a href="/pdf-merge/qr-generator.html">二维码生成</a>
</div>

<div class="container">
<h1>在线图片压缩</h1>
<p class="sub">拖入图片即可压缩 &mdash; <span>浏览器处理，无需上传，保护隐私</span></p>

<div class="dropzone" id="dropzone">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
<div class="text">拖拽图片到此处 或 点击选择</div>
<div class="hint">支持 JPG / PNG / WebP / BMP</div>
<input type="file" class="file-input" id="fileInput" accept="image/*">
</div>

<div class="stats hidden" id="stats">
<div><div class="num" id="statOriginal">-</div><div class="lbl">原始大小</div></div>
<div><div class="num" id="statCompressed">-</div><div class="lbl">压缩后大小</div></div>
<div><div class="num" id="statSaved">-</div><div class="lbl">节省空间</div></div>
</div>

<div class="preview-area" id="previewArea">
<div class="preview-card">
<div class="label">原始图片</div>
<img id="previewOriginal" alt="Original">
<div class="size" id="sizeOriginal"></div>
</div>
<div class="preview-card">
<div class="label">压缩后</div>
<img id="previewCompressed" alt="Compressed">
<div class="size saved" id="sizeCompressed"></div>
</div>
</div>

<div class="controls hidden" id="controls">
<label>压缩质量: <strong id="qualityLabel">80%</strong></label>
<input type="range" id="quality" min="10" max="100" value="80" step="5">
<div class="range-labels"><span>高压缩</span><span>高质量</span></div>
<label>输出格式:</label>
<select id="outputFormat">
<option value="image/jpeg">JPEG (最小)</option>
<option value="image/webp" selected>WebP (推荐)</option>
<option value="image/png">PNG (无损)</option>
</select>
</div>

<div class="actions hidden" id="actions">
<button class="btn btn-secondary" id="clearBtn">重新选择</button>
<button class="btn btn-primary" id="downloadBtn">下载压缩图片</button>
</div>
</div>

<footer class="footer"><p>文件仅在您的浏览器中处理，不会上传到任何服务器</p></footer>

<script>
const dz = document.getElementById("dropzone");
const fi = document.getElementById("fileInput");
const pa = document.getElementById("previewArea");
const ct = document.getElementById("controls");
const ac = document.getElementById("actions");
const st = document.getElementById("stats");
const ql = document.getElementById("quality");
const fmt = document.getElementById("outputFormat");
let currentFile = null, originalBlob = null;

dz.addEventListener("click", () => fi.click());
fi.addEventListener("change", (e) => e.target.files.length && loadImage(e.target.files[0]));
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("dragover"); });
dz.addEventListener("dragleave", () => dz.classList.remove("dragover"));
dz.addEventListener("drop", e => {
e.preventDefault(); dz.classList.remove("dragover");
e.dataTransfer.files.length && loadImage(e.dataTransfer.files[0]);
});

function formatSize(bytes) {
if (bytes < 1024) return bytes + " B";
if (bytes < 1048576) return (bytes/1024).toFixed(1) + " KB";
return (bytes/1048576).toFixed(2) + " MB";
}

function loadImage(file) {
if (!file.type.startsWith("image/")) return;
currentFile = file; originalBlob = file;
const reader = new FileReader();
reader.onload = e => {
document.getElementById("previewOriginal").src = e.target.result;
document.getElementById("sizeOriginal").textContent = formatSize(file.size);
document.getElementById("statOriginal").textContent = formatSize(file.size);
pa.classList.add("show"); ct.classList.remove("hidden"); ac.classList.remove("hidden"); st.classList.remove("hidden");
compressAndPreview();
};
reader.readAsDataURL(file);
}

function compressAndPreview() {
if (!currentFile) return;
const img = new Image();
const url = URL.createObjectURL(currentFile);
img.onload = () => {
URL.revokeObjectURL(url);
const canvas = document.createElement("canvas");
canvas.width = img.width; canvas.height = img.height;
const ctx = canvas.getContext("2d");
ctx.drawImage(img, 0, 0);
const q = parseInt(ql.value) / 100;
const mime = fmt.value;
canvas.toBlob(blob => {
document.getElementById("previewCompressed").src = URL.createObjectURL(blob);
document.getElementById("sizeCompressed").textContent = formatSize(blob.size);
const saved = currentFile.size - blob.size;
const pct = currentFile.size > 0 ? (saved / currentFile.size * 100).toFixed(0) : 0;
document.getElementById("statCompressed").textContent = formatSize(blob.size);
document.getElementById("statSaved").textContent = pct + "%";
ql.nextElementSibling.textContent = ql.value + "%";
}, mime, q);
};
img.src = url;
}

ql.addEventListener("input", compressAndPreview);
fmt.addEventListener("change", compressAndPreview);

document.getElementById("downloadBtn").addEventListener("click", () => {
if (!currentFile) return;
const img = new Image();
img.onload = () => {
URL.revokeObjectURL(img.src);
const canvas = document.createElement("canvas");
canvas.width = img.width; canvas.height = img.height;
canvas.getContext("2d").drawImage(img, 0, 0);
canvas.toBlob(blob => {
const ext = fmt.value.split("/")[1] === "jpeg" ? "jpg" : fmt.value.split("/")[1];
const name = currentFile.name.replace(/\.[^.]+$/, "_compressed." + ext);
const a = document.createElement("a");
a.href = URL.createObjectURL(blob); a.download = name;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
}, fmt.value, parseInt(ql.value)/100);
};
img.src = URL.createObjectURL(currentFile);
});

document.getElementById("clearBtn").addEventListener("click", () => {
currentFile = null; originalBlob = null;
pa.classList.remove("show"); ct.classList.add("hidden"); ac.classList.add("hidden"); st.classList.add("hidden");
fi.value = ""; document.getElementById("previewOriginal").src = ""; document.getElementById("previewCompressed").src = "";
});
</script>
</body>
</html>
